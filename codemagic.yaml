workflows:
  ios-build:
    name: Legal-App iOS
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - apple
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web export
        script: npx expo export --platform web
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Build IPA (unsigned - for Sideloadly)
        script: |
          cd ios
          xcodebuild -project App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -exportOptionsPlist $CM_BUILD_DIR/export_options.plist \
            -exportPath $CM_BUILD_DIR/ipa
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
