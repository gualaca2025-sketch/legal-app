workflows:
  ios-build:
    name: Legal-App iOS
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - apple
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web export
        script: npx expo export --platform web
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Build IPA (unsigned - for Sideloadly)
        script: |
          cd ios
          xcodebuild -project App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual
          mkdir -p $CM_BUILD_DIR/ipa/Payload
          cp -r $CM_BUILD_DIR/App.xcarchive/Products/Applications/App.app $CM_BUILD_DIR/ipa/Payload/
          cd $CM_BUILD_DIR/ipa
          zip -r App.ipa Payload/
    artifacts:
      - $CM_BUILD_DIR/ipa/App.ipa
