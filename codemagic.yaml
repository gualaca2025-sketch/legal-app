workflows:
  ios-build:
    name: Legal-App iOS
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - apple
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web export
        script: npx expo export --platform web
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Configure signing
        script: |
          echo "Checking Apple ID credentials..."
          xcrun notarytool store-credentials "AC_PASSWORD" \
            --apple-id $APPLE_ID \
            --team-id "" \
            --password $APPLE_ID_PASSWORD 2>/dev/null || true
      - name: Build IPA
        script: |
          cd ios
          xcodebuild -project App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -allowProvisioningUpdates \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=""
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -exportOptionsPlist $CM_BUILD_DIR/export_options.plist \
            -allowProvisioningUpdates \
            -exportPath $CM_BUILD_DIR/ipa
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
